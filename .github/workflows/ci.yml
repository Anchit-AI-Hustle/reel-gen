name: Reel Gen V2 CI (Cloudflare D1 + Workers + R2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg and SQLite3
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3
      - name: Verify Zero Neon & Zero Supabase Dependencies
        run: |
          if grep -riE "supabase|@neondatabase|neon-repository|neon-store" package.json src/ db/ worker/; then
            echo "ERROR: Prohibited Neon or Supabase reference detected!"
            exit 1
          fi
      - name: Verify Cloudflare D1 SQLite Migrations
        run: |
          sqlite3 /tmp/d1_ci_check.sqlite < db/migrations/0001_initial.sql
          sqlite3 /tmp/d1_ci_check.sqlite < db/migrations/0002_reference_matching.sql
          sqlite3 /tmp/d1_ci_check.sqlite "PRAGMA foreign_keys=ON; PRAGMA integrity_check;"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run unit, D1/R2, constraint, reference & real FFmpeg MP4 tests
        run: npm test
      - name: Build production Next.js app
        run: npm run build
