name: Reel Gen V2 CI (Cloudflare D1 + Workers + R2)

on:
  push:
    branches: [main, fix/verified-reference-qa]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3
      - name: Verify Zero Supabase and Neon Runtime Dependencies
        run: |
          node --input-type=module <<'CHECK'
          import fs from 'node:fs';
          import path from 'node:path';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const deps = Object.keys({ ...pkg.dependencies, ...pkg.devDependencies, ...pkg.optionalDependencies });
          const forbidden = deps.filter(name => /supabase|@neondatabase|neon-repository|neon-store/i.test(name));
          if (forbidden.length) {
            console.error('Forbidden Supabase packages:', forbidden.join(', '));
            process.exit(1);
          }
          const extensions = new Set(['.js', '.mjs', '.cjs', '.ts', '.tsx', '.jsx']);
          const files = [];
          function walk(folder) {
            if (!fs.existsSync(folder)) return;
            for (const entry of fs.readdirSync(folder, { withFileTypes: true })) {
              const full = path.join(folder, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (extensions.has(path.extname(full))) files.push(full);
            }
          }
          walk('src');
          const importPattern = /(?:from\s*['"]|require\s*\(\s*['"]|import\s*\(\s*['"])(?:@supabase\/|supabase(?:\/|['"])|@neondatabase\/|neon-repository|neon-store)/i;
          const violations = files.filter(file => importPattern.test(fs.readFileSync(file, 'utf8')));
          if (violations.length) {
            console.error('Forbidden Supabase imports:', violations.join(', '));
            process.exit(1);
          }
          console.log('No Supabase packages or runtime imports found.');
          CHECK
      - name: Check setup shell syntax
        run: |
          if [ -f setup-cloudflare-and-vercel.sh ]; then bash -n setup-cloudflare-and-vercel.sh; fi
      - name: Reject committed merge conflict markers
        run: |
          if git grep -nE '^(<{7} |={7}$|>{7} )' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.yml' '*.yaml' '*.sql' '*.sh' '*.json' '*.toml'; then
            echo "Unresolved merge conflict markers found"
            exit 1
          fi
      - name: Verify Cloudflare D1 SQLite migrations
        run: |
          sqlite3 -bail /tmp/d1_ci_check.sqlite < db/migrations/0001_initial.sql
          sqlite3 -bail /tmp/d1_ci_check.sqlite < db/migrations/0002_reference_matching.sql
          test "$(sqlite3 /tmp/d1_ci_check.sqlite 'PRAGMA integrity_check;')" = ok
          test -z "$(sqlite3 /tmp/d1_ci_check.sqlite 'PRAGMA foreign_key_check;')"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run unit, D1/R2, constraint, reference & real FFmpeg MP4 tests
        run: npm test
      - name: Build production Next.js app
        run: npm run build
